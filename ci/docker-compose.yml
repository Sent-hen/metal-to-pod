# CI VM services: the private image registry and the Jenkins controller.
# Started by provision/ci.sh with --env-file /opt/metal-to-pod/ci.env.
name: ci

services:
  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # TLS with a certificate issued by the lab CA - nodes trust the CA, so no
      # node needs an "insecure registry" exception.
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/registry.crt
      REGISTRY_HTTP_TLS_KEY: /certs/registry.key
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - /opt/metal-to-pod/secrets/registry.crt:/certs/registry.crt:ro
      - /opt/metal-to-pod/secrets/registry.key:/certs/registry.key:ro
      - registry-data:/var/lib/registry

  jenkins:
    build:
      context: ./jenkins
      args:
        K8S_MINOR: ${K8S_MINOR}
    image: metal-to-pod/jenkins:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Grant the jenkins user access to the host docker socket.
    group_add:
      - "${DOCKER_GID}"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      JENKINS_URL: ${JENKINS_URL}
      CASC_JENKINS_CONFIG: /etc/jenkins/casc.yaml
      # - skip the setup wizard: everything is configured as code (casc.yaml)
      # - allow the post-receive hook to trigger polling without credentials
      #   (it can only cause a poll, never a build of an arbitrary revision)
      # - allow checkout from the bind-mounted local bare repository
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitStatus.NOTIFY_COMMIT_ACCESS_CONTROL=disabled-for-polling
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/git:/srv/git:ro
      - ./jenkins/casc.yaml:/etc/jenkins/casc.yaml:ro
      - /opt/metal-to-pod/secrets/deployer.kubeconfig:/run/secrets/deployer.kubeconfig:ro

volumes:
  registry-data:
  jenkins-home:
