# Identity for the CI pipeline: can deploy the app into `logistics` and nothing
# more. Deliberately absent: secrets, namespaces, RBAC, cluster-scoped objects.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: logistics
---
# Long-lived token for an out-of-cluster client (Jenkins). Fine for a lab;
# production would prefer short-lived tokens (TokenRequest) or OIDC.
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-deployer-token
  namespace: logistics
  annotations:
    kubernetes.io/service-account.name: jenkins-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-deployer
  namespace: logistics
rules:
  - apiGroups: ["apps"]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: ["policy"]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ["events.k8s.io"]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: logistics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-deployer
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: logistics
