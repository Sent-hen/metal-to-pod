# Pod Security Admission "restricted" is enforced at the namespace level: a pod
# that runs as root, keeps Linux capabilities, or allows privilege escalation is
# rejected by the API server before it is ever scheduled.
apiVersion: v1
kind: Namespace
metadata:
  name: logistics
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
